<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Response Comparison - Project Odyssey</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .main-content {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 30px;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .question-input {
            width: 100%;
            padding: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .question-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .ask-button {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .ask-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .ask-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .responses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .response-card {
            background: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            border-left: 4px solid #3b82f6;
            transition: all 0.3s ease;
        }

        .response-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .response-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
        }

        .user-info h3 {
            color: #1e293b;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .user-info p {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .response-content {
            color: #374151;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .response-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .access-info {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .access-denied {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .access-denied .response-content {
            color: #dc2626;
            font-style: italic;
        }

        .no-response {
            text-align: center;
            padding: 40px;
            color: #6b7280;
            font-style: italic;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .question-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            padding-top: 60px;
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .modal-header h3 {
            margin: 0;
            color: #333;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-body {
            padding: 10px 0;
            color: #555;
            font-size: 0.95rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        .document-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .document-list li {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .clickable-docs {
            cursor: pointer;
            color: #3b82f6;
            text-decoration: underline;
        }

        .clickable-docs:hover {
            color: #1d4ed8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .responses-grid {
                grid-template-columns: 1fr;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Employee Response Comparison</h1>
            <p>Ask a question and see how different employees would respond based on their access levels</p>
        </div>

        <div class="nav-links" style="margin: 30px 0 40px 0;">
            <a href="/"><i class="fas fa-home"></i> Main Demo</a>
            <a href="/chunks"><i class="fas fa-cubes"></i> Chunks View</a>
            <a href="/compare"><i class="fas fa-users"></i> Compare Responses</a>
        </div>

        <div class="main-content">
            <div class="question-section">
                <textarea 
                    id="questionInput" 
                    class="question-input" 
                    placeholder="Ask your question here... (e.g., 'What is the current status of the core engine?', 'How does the authentication system work?', 'What are the performance metrics?')"
                ></textarea>
                <button id="askButton" class="ask-button">
                    <i class="fas fa-paper-plane"></i> Ask All Employees
                </button>
            </div>

            <div class="suggested-questions" style="margin-top: 30px; padding: 20px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0;">
                <h4 style="margin-bottom: 15px; color: #1e293b; font-size: 1.1rem;">
                    <i class="fas fa-lightbulb"></i> Try These Questions:
                </h4>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px;">
                    <button class="question-btn" onclick="askSuggestedQuestion('Give me a full summary of Project Odyssey\'s status, technology, and performance.')" style="display: block; width: 100%; padding: 10px 15px; margin-bottom: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; color: #475569; transition: all 0.3s ease;">
                        "Give me a full summary of Project Odyssey's status, technology, and performance."
                    </button>
                    <button class="question-btn" onclick="askSuggestedQuestion('Tell me about the UI/UX guidelines for Project Odyssey?')" style="display: block; width: 100%; padding: 10px 15px; margin-bottom: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; color: #475569; transition: all 0.3s ease;">
                        "Tell me about the UI/UX guidelines for Project Odyssey?"
                    </button>
                    <button class="question-btn" onclick="askSuggestedQuestion('What is the color palette for the project?')" style="display: block; width: 100%; padding: 10px 15px; margin-bottom: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; color: #475569; transition: all 0.3s ease;">
                        "What is the color palette for the project?"
                    </button>
                    <button class="question-btn" onclick="askSuggestedQuestion('What are the API endpoints?')" style="display: block; width: 100%; padding: 10px 15px; margin-bottom: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; color: #475569; transition: all 0.3s ease;">
                        "What are the API endpoints?"
                    </button>
                    <button class="question-btn" onclick="askSuggestedQuestion('Tell me about the API documentation.')" style="display: block; width: 100%; padding: 10px 15px; margin-bottom: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; color: #475569; transition: all 0.3s ease;">
                        "Tell me about the API documentation."
                    </button>
                    <button class="question-btn" onclick="askSuggestedQuestion('What are the financial projections for the project?')" style="display: block; width: 100%; padding: 10px 15px; margin-bottom: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; text-align: left; font-size: 0.9rem; color: #475569; transition: all 0.3s ease;">
                        "What are the financial projections for the project?"
                    </button>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <i class="fas fa-spinner"></i>
                <p>Getting responses from all employees...</p>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div id="responsesContainer"></div>
        </div>
    </div>

    <script>
        const questionInput = document.getElementById('questionInput');
        const askButton = document.getElementById('askButton');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const responsesContainer = document.getElementById('responsesContainer');

        // Available users
        const users = {
            'ceo_sandra': {
                name: 'Sandra (CEO)',
                description: 'CEO with access to everything',
                avatar: 'S'
            },
            'lead_dev_raj': {
                name: 'Raj (Lead Developer)',
                description: 'Lead developer with engineering access',
                avatar: 'R'
            },
            'junior_dev_chloe': {
                name: 'Chloe (Junior Developer)',
                description: 'Junior developer with limited access',
                avatar: 'C'
            },
            'sales_bob': {
                name: 'Bob (Sales)',
                description: 'Sales team with public access only',
                avatar: 'B'
            }
        };

        async function askAllEmployees() {
            const question = questionInput.value.trim();
            
            if (!question) {
                showError('Please enter a question.');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            responsesContainer.innerHTML = '';
            askButton.disabled = true;

            try {
                // Get responses from all employees
                const responses = await Promise.all(
                    Object.keys(users).map(async (userId) => {
                        try {
                            const response = await fetch('/api/chat', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    message: question,
                                    userId: userId
                                })
                            });

                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }

                            return await response.json();
                        } catch (error) {
                            console.error(`Error getting response for ${userId}:`, error);
                            return {
                                user: users[userId],
                                response: 'Error: Unable to get response',
                                accessDenied: true,
                                documentsAccessed: 0
                            };
                        }
                    })
                );

                displayResponses(responses, question);

            } catch (error) {
                console.error('Error:', error);
                showError('An error occurred while getting responses. Please try again.');
            } finally {
                loading.style.display = 'none';
                askButton.disabled = false;
            }
        }

        function displayResponses(responses, question) {
            responsesContainer.innerHTML = `
                <h2 style="margin-bottom: 20px; color: #1e293b; text-align: center;">
                    Responses to: "${question}"
                </h2>
                <div class="responses-grid">
                    ${responses.map(response => createResponseCard(response)).join('')}
                </div>
            `;
        }

        function createResponseCard(response) {
            const user = response.user;
            const isAccessDenied = response.accessDenied;
            const docCount = response.documentsAccessed || 0;
            const docNames = response.documentNames || [];
            
            return `
                <div class="response-card ${isAccessDenied ? 'access-denied' : ''}">
                    <div class="response-header">
                        <div class="user-avatar">${user.avatar}</div>
                        <div class="user-info">
                            <h3>${user.name}</h3>
                            <p>${user.description}</p>
                        </div>
                    </div>
                    <div class="response-content">
                        ${isAccessDenied ? 
                            '<em>Access denied - No relevant information available based on current permissions.</em>' : 
                            response.response
                        }
                    </div>
                    <div class="response-meta">
                        <div class="access-info">
                            <i class="fas fa-file-alt"></i>
                            <span class="clickable-docs" onclick="showCompareDocumentModal('${docNames.join(', ')}', ${docCount})">
                                ${docCount} documents accessed
                            </span>
                        </div>
                        <div>
                            <i class="fas fa-clock"></i>
                            <span>${new Date(response.timestamp || Date.now()).toLocaleTimeString()}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        // Event listeners
        askButton.addEventListener('click', askAllEmployees);
        
        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                askAllEmployees();
            }
        });

        // Focus on question input when page loads
        questionInput.focus();

        // Function to handle suggested questions
        function askSuggestedQuestion(question) {
            questionInput.value = question;
            askAllEmployees();
        }

        // Document display names mapping
        const documentDisplayNames = {
            'core_engine': 'Core Engine Technical Documentation',
            'public_api_docs': 'Public API Documentation',
            'architecture_v3': 'Architecture v3 Documentation',
            'internal_sdk': 'Internal SDK Documentation',
            'design_mockups': 'Design Mockups & Guidelines',
            'finance_performance': 'Financial Performance Report'
        };

        // Show document modal for compare responses
        function showCompareDocumentModal(docNames, docCount) {
            if (docCount === 0) return;
            
            // Convert short names to display names
            const displayNames = docNames.split(', ').map(doc => {
                return documentDisplayNames[doc] || doc;
            });
            
            // Create modal HTML
            const modalHTML = `
                <div id="compareDocumentModal" class="modal">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>📄 Documents Accessed (${docCount})</h3>
                            <span class="close" onclick="closeCompareDocumentModal()">&times;</span>
                        </div>
                        <div class="modal-body">
                            <p><strong>Documents used to answer this question:</strong></p>
                            <ul class="document-list">
                                ${displayNames.map(doc => `<li>📋 ${doc}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
            
            // Add modal to body
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            
            // Show modal
            document.getElementById('compareDocumentModal').style.display = 'block';
        }

        // Close compare document modal
        function closeCompareDocumentModal() {
            const modal = document.getElementById('compareDocumentModal');
            if (modal) {
                modal.remove();
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('compareDocumentModal');
            if (event.target === modal) {
                closeCompareDocumentModal();
            }
        };
    </script>
</body>
</html>
