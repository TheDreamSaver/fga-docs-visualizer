<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chunks Visualizer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav-links {
            text-align: center;
            margin-bottom: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .main-content {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 30px;
        }

        .stats-section {
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8fafc;
            border-radius: 15px;
            padding: 25px;
            border-left: 4px solid #3b82f6;
            transition: all 0.3s ease;
            text-align: center;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3b82f6;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .chunks-section h3 {
            color: #1e293b;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chunks-container {
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
        }

        .chunk-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            margin: 15px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .chunk-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .chunk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .chunk-id {
            font-weight: bold;
            color: #3b82f6;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9rem;
        }

        .chunk-doc {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .chunk-content {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }

        .chunk-metadata {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #6b7280;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .embedding-preview {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.75rem;
            color: #6b7280;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid #e2e8f0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 20px;
            border-radius: 12px;
            margin: 20px;
            text-align: center;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .refresh-button {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .document-filter {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .filter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .filter-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-all-controls {
            display: flex;
            gap: 10px;
        }

        .select-all-btn, .clear-all-btn {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .select-all-btn:hover {
            background: #d1d5db;
        }

        .clear-all-btn:hover {
            background: #fca5a5;
            color: #991b1b;
        }

        .document-checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .document-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .document-checkbox:hover {
            background: #f9fafb;
            border-color: #3b82f6;
        }

        .document-checkbox input[type="checkbox"] {
            margin: 0;
            cursor: pointer;
        }

        .document-checkbox label {
            flex: 1;
            cursor: pointer;
            font-weight: 500;
            color: #374151;
        }

        .document-chunk-count {
            background: #3b82f6;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .filter-results-summary {
            margin-top: 15px;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            color: #6b7280;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .embedding-section {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .embedding-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #374151;
        }

        .embedding-visualization {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .embedding-bar {
            width: 8px;
            height: 20px;
            background: #3b82f6;
            border-radius: 2px;
            transition: all 0.2s ease;
        }

        .embedding-bar:hover {
            transform: scaleY(1.2);
            background: #1d4ed8;
        }

        .embedding-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .embedding-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .embedding-toggle {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: auto;
        }

        .embedding-toggle:hover {
            background: #d1d5db;
        }

        .embedding-toggle.active {
            background: #3b82f6;
            color: white;
        }

        .embedding-values {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .embedding-values-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .embedding-values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #f8fafc;
            border-radius: 6px;
        }

        .embedding-value-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: white;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            font-size: 0.8rem;
        }

        .dimension-label {
            font-weight: 500;
            color: #6b7280;
        }

        .dimension-value {
            font-family: 'Courier New', monospace;
            font-weight: 600;
        }

        .dimension-value.positive {
            color: #059669;
        }

        .dimension-value.negative {
            color: #dc2626;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .chunk-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .document-checkboxes {
                grid-template-columns: 1fr;
            }
            
            .filter-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .select-all-controls {
                width: 100%;
                justify-content: space-between;
            }
            
            .embedding-values-grid {
                grid-template-columns: 1fr;
            }
            
            .embedding-value-item {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-cubes"></i> Chunks Visualizer</h1>
            <p>Explore the document chunks stored in your vector database</p>
        </div>

        <div class="nav-links">
            <a href="/"><i class="fas fa-home"></i> Main Demo</a>
            <a href="/chunks"><i class="fas fa-cubes"></i> Chunks View</a>
            <a href="/compare"><i class="fas fa-users"></i> Compare Responses</a>
        </div>

        <div class="main-content">
            <div class="stats-section">
                <h3><i class="fas fa-chart-bar"></i> Database Statistics</h3>
                <div class="stats-grid" id="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalChunks">-</div>
                        <div class="stat-label">Total Chunks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="uniqueDocs">-</div>
                        <div class="stat-label">Unique Documents</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="avgChunkSize">-</div>
                        <div class="stat-label">Avg Chunk Size</div>
                    </div>
                </div>
            </div>

            <div class="document-filter" id="documentFilter" style="display: none;">
                <div class="filter-header">
                    <div class="filter-title">
                        <i class="fas fa-filter"></i> Filter by Document
                    </div>
                    <div class="select-all-controls">
                        <button class="select-all-btn" onclick="selectAllDocuments()">
                            <i class="fas fa-check-double"></i> Select All
                        </button>
                        <button class="clear-all-btn" onclick="clearAllDocuments()">
                            <i class="fas fa-times"></i> Clear All
                        </button>
                    </div>
                </div>
                <div class="document-checkboxes" id="documentCheckboxes">
                    <!-- Document checkboxes will be populated here -->
                </div>
                <div class="filter-results-summary" id="filterSummary">
                    <i class="fas fa-info-circle"></i>
                    <span id="filterSummaryText">Loading document options...</span>
                </div>
            </div>

            <div class="chunks-section">
                <div class="section-header">
                    <h3><i class="fas fa-file-alt"></i> Document Chunks</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="embedding-toggle" onclick="toggleAllEmbeddings()" id="globalEmbeddingToggle">
                            <i class="fas fa-brain"></i> <span>Show All Embeddings</span>
                        </button>
                        <button class="refresh-button" onclick="loadChunks()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                </div>
                
                <div class="chunks-container" id="chunksContainer">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Loading chunks...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allChunks = [];
        let selectedDocuments = new Set();

        async function loadChunks() {
            try {
                const container = document.getElementById('chunksContainer');
                container.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Loading chunks...</p>
                    </div>
                `;

                const timestamp = Date.now();
                const response = await fetch(`/api/chunks?t=${timestamp}`);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }

                allChunks = data.chunks;
                displayStats(data);
                setupDocumentFilter(data.chunks);
                applyDocumentFilter();
                
            } catch (error) {
                document.getElementById('chunksContainer').innerHTML = 
                    `<div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error loading chunks: ${error.message}</p>
                    </div>`;
            }
        }

        function displayStats(data) {
            const uniqueDocs = new Set(data.chunks.map(chunk => chunk.metadata?.doc_id)).size;
            const avgChunkSize = Math.round(
                data.chunks.reduce((sum, chunk) => sum + chunk.content.length, 0) / data.chunks.length
            );

            document.getElementById('totalChunks').textContent = data.totalChunks;
            document.getElementById('uniqueDocs').textContent = uniqueDocs;
            document.getElementById('avgChunkSize').textContent = avgChunkSize + ' chars';
        }

        function displayChunks(chunks) {
            const container = document.getElementById('chunksContainer');
            
            if (chunks.length === 0) {
                container.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-inbox"></i>
                        <p>No chunks found</p>
                    </div>
                `;
                return;
            }

            const chunksHtml = chunks.map(chunk => `
                <div class="chunk-card">
                    <div class="chunk-header">
                        <span class="chunk-id">${chunk.id}</span>
                        <span class="chunk-doc">${chunk.metadata?.doc_id || 'Unknown'}</span>
                    </div>
                    <div class="chunk-content">${escapeHtml(chunk.content)}</div>
                    <div class="chunk-metadata">
                        <div class="metadata-item">
                            <i class="fas fa-file"></i>
                            <strong>Source:</strong> ${chunk.metadata?.source || 'Unknown'}
                        </div>
                        <div class="metadata-item">
                            <i class="fas fa-hashtag"></i>
                            <strong>Chunk Index:</strong> ${chunk.metadata?.chunk_index !== undefined ? chunk.metadata.chunk_index : 'Unknown'}
                        </div>
                    </div>
                    ${chunk.embedding ? `
                        <div class="embedding-section">
                            <div class="embedding-header">
                                <i class="fas fa-brain"></i>
                                <span>Vector Embedding</span>
                                <button class="embedding-toggle" onclick="toggleEmbeddingView('${chunk.id}')" id="toggle_${chunk.id}">
                                    <i class="fas fa-eye"></i> <span>Show Visualization</span>
                                </button>
                            </div>
                            <div class="embedding-content" id="embedding_${chunk.id}" style="display: none;">
                                <div class="embedding-visualization">
                                    ${chunk.embedding.map((value, index) => {
                                        const height = Math.abs(value) * 20 + 5;
                                        const color = value >= 0 ? '#3b82f6' : '#ef4444';
                                        return `<div class="embedding-bar" style="height: ${height}px; background: ${color};" title="Dim ${index}: ${value.toFixed(3)}"></div>`;
                                    }).join('')}
                                </div>
                                <div class="embedding-values">
                                    <div class="embedding-values-header">
                                        <i class="fas fa-list"></i>
                                        <span>Vector Values (first ${chunk.embedding.length} dimensions)</span>
                                    </div>
                                    <div class="embedding-values-grid">
                                        ${chunk.embedding.map((value, index) => `
                                            <div class="embedding-value-item">
                                                <span class="dimension-label">Dim ${index}:</span>
                                                <span class="dimension-value ${value >= 0 ? 'positive' : 'negative'}">${value.toFixed(6)}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="embedding-stats">
                                    <div class="embedding-stat">
                                        <i class="fas fa-chart-line"></i>
                                        <span>Min: ${Math.min(...chunk.embedding).toFixed(3)}</span>
                                    </div>
                                    <div class="embedding-stat">
                                        <i class="fas fa-chart-line"></i>
                                        <span>Max: ${Math.max(...chunk.embedding).toFixed(3)}</span>
                                    </div>
                                    <div class="embedding-stat">
                                        <i class="fas fa-calculator"></i>
                                        <span>Mean: ${(chunk.embedding.reduce((a, b) => a + b, 0) / chunk.embedding.length).toFixed(3)}</span>
                                    </div>
                                    <div class="embedding-stat">
                                        <i class="fas fa-ruler"></i>
                                        <span>Magnitude: ${Math.sqrt(chunk.embedding.reduce((sum, val) => sum + val * val, 0)).toFixed(3)}</span>
                                    </div>
                                </div>
                                <div style="margin-top: 8px; font-size: 0.8rem; color: #6b7280;">
                                    <i class="fas fa-info-circle"></i>
                                    <span>Showing first ${chunk.embedding.length} dimensions of 384-dimensional vector</span>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `).join('');

            container.innerHTML = chunksHtml;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setupDocumentFilter(chunks) {
            // Get unique documents with chunk counts
            const documentStats = {};
            chunks.forEach(chunk => {
                const docId = chunk.metadata?.doc_id || 'Unknown';
                documentStats[docId] = (documentStats[docId] || 0) + 1;
            });

            // Sort documents by name
            const sortedDocs = Object.keys(documentStats).sort();
            
            // Initially select all documents
            selectedDocuments = new Set(sortedDocs);

            // Create checkboxes
            const checkboxContainer = document.getElementById('documentCheckboxes');
            checkboxContainer.innerHTML = sortedDocs.map(docId => `
                <div class="document-checkbox">
                    <input type="checkbox" id="doc_${docId}" checked onchange="toggleDocument('${docId}')">
                    <label for="doc_${docId}">${docId}</label>
                    <span class="document-chunk-count">${documentStats[docId]}</span>
                </div>
            `).join('');

            // Show the filter section
            document.getElementById('documentFilter').style.display = 'block';
            
            updateFilterSummary();
        }

        function toggleDocument(docId) {
            if (selectedDocuments.has(docId)) {
                selectedDocuments.delete(docId);
            } else {
                selectedDocuments.add(docId);
            }
            applyDocumentFilter();
            updateFilterSummary();
        }

        function selectAllDocuments() {
            const checkboxes = document.querySelectorAll('#documentCheckboxes input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = true;
                const docId = checkbox.id.replace('doc_', '');
                selectedDocuments.add(docId);
            });
            applyDocumentFilter();
            updateFilterSummary();
        }

        function clearAllDocuments() {
            const checkboxes = document.querySelectorAll('#documentCheckboxes input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
                const docId = checkbox.id.replace('doc_', '');
                selectedDocuments.delete(docId);
            });
            applyDocumentFilter();
            updateFilterSummary();
        }

        function applyDocumentFilter() {
            const filteredChunks = allChunks.filter(chunk => {
                const docId = chunk.metadata?.doc_id || 'Unknown';
                return selectedDocuments.has(docId);
            });
            
            displayChunks(filteredChunks);
            updateFilteredStats(filteredChunks);
        }

        function updateFilteredStats(filteredChunks) {
            const uniqueDocs = new Set(filteredChunks.map(chunk => chunk.metadata?.doc_id)).size;
            const avgChunkSize = filteredChunks.length > 0 ? Math.round(
                filteredChunks.reduce((sum, chunk) => sum + chunk.content.length, 0) / filteredChunks.length
            ) : 0;

            document.getElementById('totalChunks').textContent = filteredChunks.length;
            document.getElementById('uniqueDocs').textContent = uniqueDocs;
            document.getElementById('avgChunkSize').textContent = avgChunkSize + ' chars';
        }

        function updateFilterSummary() {
            const totalDocs = document.querySelectorAll('#documentCheckboxes input[type="checkbox"]').length;
            const selectedCount = selectedDocuments.size;
            const filteredChunks = allChunks.filter(chunk => {
                const docId = chunk.metadata?.doc_id || 'Unknown';
                return selectedDocuments.has(docId);
            });
            
            const summaryText = selectedCount === totalDocs 
                ? `Showing all ${filteredChunks.length} chunks from ${selectedCount} documents`
                : selectedCount === 0
                ? `No documents selected - showing 0 chunks`
                : `Showing ${filteredChunks.length} chunks from ${selectedCount} of ${totalDocs} selected documents`;
            
            document.getElementById('filterSummaryText').textContent = summaryText;
        }

        function toggleEmbeddingView(chunkId) {
            const embeddingContent = document.getElementById(`embedding_${chunkId}`);
            const toggleButton = document.getElementById(`toggle_${chunkId}`);
            const icon = toggleButton.querySelector('i');
            const text = toggleButton.querySelector('span');
            
            if (embeddingContent.style.display === 'none') {
                embeddingContent.style.display = 'block';
                toggleButton.classList.add('active');
                icon.className = 'fas fa-eye-slash';
                if (text) text.textContent = 'Hide Visualization';
            } else {
                embeddingContent.style.display = 'none';
                toggleButton.classList.remove('active');
                icon.className = 'fas fa-eye';
                if (text) text.textContent = 'Show Visualization';
            }
        }

        function toggleAllEmbeddings() {
            const globalToggle = document.getElementById('globalEmbeddingToggle');
            if (!globalToggle) {
                return;
            }
            
            const allEmbeddings = document.querySelectorAll('.embedding-content');
            const allToggles = document.querySelectorAll('.embedding-toggle:not(#globalEmbeddingToggle)');
            
            // Check if any embeddings are currently visible
            let visibleCount = 0;
            allEmbeddings.forEach(embedding => {
                if (embedding.style.display !== 'none') {
                    visibleCount++;
                }
            });
            
            const isShowing = visibleCount > 0;
            
            // Toggle all embeddings
            allEmbeddings.forEach(embedding => {
                embedding.style.display = isShowing ? 'none' : 'block';
            });
            
            // Update all individual toggle buttons
            allToggles.forEach(toggle => {
                const toggleIcon = toggle.querySelector('i');
                const toggleText = toggle.querySelector('span');
                
                if (isShowing) {
                    toggle.classList.remove('active');
                    toggleIcon.className = 'fas fa-eye';
                    if (toggleText) toggleText.textContent = 'Show Visualization';
                } else {
                    toggle.classList.add('active');
                    toggleIcon.className = 'fas fa-eye-slash';
                    if (toggleText) toggleText.textContent = 'Hide Visualization';
                }
            });
            
            // Update global toggle button
            const icon = globalToggle.querySelector('i');
            const text = globalToggle.querySelector('span');
            
            if (isShowing) {
                globalToggle.classList.remove('active');
                icon.className = 'fas fa-brain';
                if (text) text.textContent = 'Show All Embeddings';
            } else {
                globalToggle.classList.add('active');
                icon.className = 'fas fa-eye-slash';
                if (text) text.textContent = 'Hide All Embeddings';
            }
        }

        // Load chunks when page loads
        loadChunks();
    </script>
</body>
